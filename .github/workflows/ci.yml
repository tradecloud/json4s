name: ci
on:
  push:
  pull_request:
  schedule:
  - cron: '0 2 * * *'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: 8
            scala: 2_12
          - java: 8
            scala: 2_13
          - java: 8
            scala: 3
          - java: 11
            scala: 2
          - java: 21
            scala: 2
    steps:
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: ${{matrix.java}}
        distribution: temurin
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: coursier/cache-action@4e2615869d13561d626ed48655e1a39e5b192b3c # v6.4.9
    - run: |
        export TZ=Australia/Canberra
        case ${{ matrix.scala }} in
          2_12)
            ./sbt -v scalafmtSbtCheck SetScala212 scalafmtCheckAll test
            ;;
          2_13)
            ./sbt -v scalafmtSbtCheck SetScala213 scalafmtCheckAll test
            ;;
          2)
            ./sbt -v scalafmtSbtCheck scalafmtCheckAll test
            ;;
          3)
            ./sbt -v scalafmtSbtCheck SetScala3 scalafmtCheckAll test
            ;;
          *)
            echo "unknown scala version"
            exit 1
        esac
